# Configuración general de Datronix Back-Office.
spring.application.name=datronix-backoffice

# CockroachDB. En Render define SPRING_DATASOURCE_URL, USERNAME y PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://datronix-35292.j77.aws-us-east-1.cockroachlabs.cloud:26257/defaultdb?sslmode=verify-full&sslrootcert=${APPDATA}/postgresql/root.crt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:datronix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.CockroachDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# HikariCP: límites conservadores para CockroachDB Serverless.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=300000

# Render asigna PORT al contenedor.
server.port=${PORT:8080}

# SMTP Gmail: define SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD en Render.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:linaresjulian77@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Restringe CORS al frontend configurado.
datronix.cors.allowed-origin-patterns=${DATRONIX_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Render usa este endpoint para comprobar el estado del servicio.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
