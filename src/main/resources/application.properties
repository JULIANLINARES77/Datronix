# Configuración general
spring.application.name=datronix-backoffice

# ========== COCKROACHDB ==========
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://datronix-35292.j77.aws-us-east-1.cockroachlabs.cloud:26257/defaultdb?sslmode=verify-full&sslrootcert=C:/Users/linar/AppData/Roaming/postgresql/root.crt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:datronix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.CockroachDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ========== HIKARI CP ==========
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=300000

# ========== SERVIDOR ==========
server.port=${PORT:8080}

# ========== RESEND (API DE CORREO POR HTTPS) ==========
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${RESEND_FROM:onboarding@resend.dev}

# ========== CORS ==========
datronix.cors.allowed-origin-patterns=${DATRONIX_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# ========== ACTUATOR ==========
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
