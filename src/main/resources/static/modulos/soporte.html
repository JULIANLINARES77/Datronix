<section class="demo-module">
    <h1 class="module-heading">Soporte</h1>
    <div class="support-grid">
        <section class="workflow-panel">
            <h2 class="dashboard-panel-title">Nuevo ticket</h2>
            <form class="workflow-panel-body" id="formTicketSoporte">
                <div class="support-form-fields">
                    <label class="workflow-field span-all">Empresa<input name="empresa" maxlength="100" required></label>
                    <label class="workflow-field">ID remitente (Cédula)<input name="idRemitente" maxlength="20" required></label>
                    <label class="workflow-field">Nombre del remitente<input name="nombreRemitente" maxlength="100"></label>
                    <label class="workflow-field">Teléfono<input name="telefonoRemitente" maxlength="20" required></label>
                    <label class="workflow-field">Asunto<input name="asunto" maxlength="100" required></label>
                    <label class="workflow-field span-all">Descripción<textarea name="descripcion" maxlength="500" required rows="5" placeholder="Describe el inconveniente..."></textarea></label>
                    <label class="workflow-field span-all">Fecha de creación<input name="fechaCreacion" type="datetime-local" required></label>
                </div>
                <button class="workflow-action full-width" type="submit" style="margin-top:16px"><i class="fas fa-paper-plane"></i> Enviar ticket</button>
                <p class="workflow-helper" id="estadoTicketSoporte" role="status"></p>
            </form>
        </section>

        <section class="workflow-panel">
            <h2 class="dashboard-panel-title">Tickets enviados</h2>
            <div class="workflow-panel-body workflow-table-wrap">
                <table class="workflow-table table-wide">
                    <thead><tr><th>ID</th><th>Empresa</th><th>ID remitente</th><th>Nombre remitente</th><th>Teléfono</th><th>Asunto</th><th>Descripción</th><th>Fecha de creación</th></tr></thead>
                    <tbody id="ticketsSoporteTbody"><tr><td colspan="8">Cargando tickets...</td></tr></tbody>
                </table>
            </div>
        </section>
    </div>
</section>
