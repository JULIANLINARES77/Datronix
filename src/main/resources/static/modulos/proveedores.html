<!-- Este fragmento se inserta en el panel y proveedores.js conecta sus controles. -->
<div class="modulo-clientes crud-module">
    <span class="module-username-hidden" id="nombreUsuarioModulo"></span>
    <!-- Barra de herramientas -->
    <div class="toolbar-clientes">
        <h1 class="crud-heading">Proveedores</h1>
        <div class="busqueda">
            <input type="text" id="txtBuscarProveedor" placeholder="Buscar por ID, empresa o contacto...">
            <button class="btn icon-only" id="btnBuscarProveedor" aria-label="Buscar" title="Buscar"><i class="fas fa-search"></i></button>
            <button class="btn icon-only" id="btnActualizarProveedor" aria-label="Actualizar" title="Actualizar"><i class="fas fa-rotate"></i></button>
        </div>
        <div class="acciones">
            <button class="btn icon-only" id="btnModificarProveedor" aria-label="Editar proveedor seleccionado" title="Editar"><i class="fas fa-pencil-alt"></i></button>
            <button class="btn btn-danger icon-only" id="btnEliminarProveedor" aria-label="Eliminar proveedor seleccionado" title="Eliminar"><i class="fas fa-trash"></i></button>
            <button class="btn btn-primary" id="btnAgregarProveedor"><i class="fas fa-plus"></i> Agregar proveedor</button>
        </div>
    </div>

    <div class="crud-kpis">
        <article class="crud-kpi"><p class="crud-kpi-label">Proveedores registrados</p><p class="crud-kpi-value">24</p></article>
        <article class="crud-kpi"><p class="crud-kpi-label">Productos abastecidos</p><p class="crud-kpi-value">562</p></article>
        <article class="crud-kpi"><p class="crud-kpi-label">Ciudades</p><p class="crud-kpi-value">7</p></article>
    </div>

    <!-- Tabla de proveedores -->
    <div class="table-container">
        <table class="table-datronix" id="tablaProveedores">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Empresa</th>
                    <th>Contacto</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th>Dirección</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbodyProveedores">
                <tr><td colspan="7" class="text-center">Cargando proveedores...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Agregar Proveedor -->
<div class="modal-overlay" id="modalAgregarProveedor">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Nuevo Proveedor Datronix</h2>
            <span class="modal-close" id="closeAgregarProveedor">&times;</span>
        </div>
        <form id="formAgregarProveedor">
            <div class="form-group">
                <label>ID PROVEEDOR (NIT)</label>
                <input type="text" id="txtIdProveedor" placeholder="Ej: 900123456-7" required>
            </div>
            <div class="form-group">
                <label>EMPRESA</label>
                <input type="text" id="txtNombreEmpresa" placeholder="Nombre de la empresa" required>
            </div>
            <div class="form-group">
                <label>CONTACTO</label>
                <input type="text" id="txtContactoProveedor" placeholder="Nombre del contacto">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>TELÉFONO</label>
                    <input type="number" id="txtTelefonoProveedor" placeholder="Teléfono" required>
                </div>
                <div class="form-group">
                    <label>EMAIL</label>
                    <input type="email" id="txtEmailProveedor" placeholder="correo@empresa.com">
                </div>
            </div>
            <div class="form-group">
                <label>DIRECCIÓN</label>
                <input type="text" id="txtDireccionProveedor" placeholder="Dirección completa">
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-success" id="btnGuardarProveedor">💾 Guardar</button>
                <button type="button" class="btn btn-outline" id="btnLimpiarProveedor">🧹 Limpiar</button>
                <button type="button" class="btn btn-danger" id="btnVolverProveedor">⬅ Volver</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Editar Proveedor -->
<div class="modal-overlay" id="modalEditarProveedor">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Editar Proveedor Datronix</h2>
            <span class="modal-close" id="closeEditarProveedor">&times;</span>
        </div>
        <form id="formEditarProveedor">
            <div class="form-group">
                <label>ID PROVEEDOR (NIT)</label>
                <input type="text" id="txtIdProveedorEdit" disabled>
            </div>
            <div class="form-group">
                <label>EMPRESA</label>
                <input type="text" id="txtNombreEmpresaEdit" placeholder="Nombre de la empresa" required>
            </div>
            <div class="form-group">
                <label>CONTACTO</label>
                <input type="text" id="txtContactoProveedorEdit" placeholder="Nombre del contacto">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>TELÉFONO</label>
                    <input type="number" id="txtTelefonoProveedorEdit" placeholder="Teléfono" required>
                </div>
                <div class="form-group">
                    <label>EMAIL</label>
                    <input type="email" id="txtEmailProveedorEdit" placeholder="correo@empresa.com">
                </div>
            </div>
            <div class="form-group">
                <label>DIRECCIÓN</label>
                <input type="text" id="txtDireccionProveedorEdit" placeholder="Dirección completa">
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-success" id="btnGuardarProveedorEdit">💾 Guardar</button>
                <button type="button" class="btn btn-outline" id="btnLimpiarProveedorEdit">🧹 Limpiar</button>
                <button type="button" class="btn btn-danger" id="btnVolverProveedorEdit">⬅ Volver</button>
            </div>
        </form>
    </div>
</div>

<!-- Script específico -->
<script type="module" src="/js/proveedores.js"></script>
