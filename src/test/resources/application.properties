spring.datasource.url=jdbc:h2:mem:datronix-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=test
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
datronix.cors.allowed-origin-patterns=http://localhost
resend.api-key=test-api-key
resend.from-address=test@example.testtest
